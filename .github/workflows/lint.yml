name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  lint:
    runs-on: xcode-27
    timeout-minutes: 10
    permissions:
      contents: read # checkout; only needed for private repos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint
        run: swift format lint --strict --recursive .
